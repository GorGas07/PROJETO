<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Claudia Consultora de Vendas</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TOPO -->
    <header class="topbar">
        <div class="brand">
            Claudia • Consultora de Vendas
        </div>

        <nav>
            <button onclick="showTab('inicio')">Início</button>
            <button onclick="showTab('sobre')">Sobre</button>
            <button onclick="showTab('contato')">Contato</button>
        </nav>
    </header>

    <!-- CONTEÚDO -->
    <main>

        <!-- INÍCIO -->
        <section id="inicio" class="tab-content">
            <h1>Bem-vindo</h1>

            <p>
                Site da Claudia Consultora de Vendas.
            </p>

            <button onclick="toggleInfo()">
                Mostrar informações
            </button>

            <div id="extraInfo" style="display:none;">
                <p>
                    Aqui você pode adicionar informações extras sobre produtos,
                    serviços e atendimento.
                </p>
            </div>
        </section>

        <!-- SOBRE -->
        <section id="sobre" class="tab-content" style="display:none;">
            <h1>Sobre</h1>

            <p>
                Trabalhamos com atendimento personalizado e foco em qualidade.
            </p>
        </section>

        <!-- CONTATO -->
        <section id="contato" class="tab-content" style="display:none;">
            <h1>Contato</h1>

            <p>Email: contato@email.com</p>
            <p>Telefone: (00) 00000-0000</p>
        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>

</html>
